<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded Base Background -->
  <rect width="32" height="32" rx="7" fill="#0f172a" />
  
  <!-- Outer TV bezel / Frame -->
  <rect x="3.5" y="4.5" width="25" height="19" rx="3.5" fill="#1e293b" stroke="#334155" stroke-width="1" />
  
  <!-- Screen Area -->
  <rect x="5" y="6" width="22" height="16" rx="2" fill="#090d16" />
  
  <!-- EPG Timetable Colored Genre Cells (Representing colorful TV guide) -->
  <!-- Column 1 (e.g. Terrestrial 1) -->
  <rect x="6.5" y="7.5" width="4.5" height="4" rx="0.8" fill="#38bdf8" />
  <rect x="6.5" y="12.5" width="4.5" height="8" rx="0.8" fill="#ec4899" />
  
  <!-- Column 2 (e.g. Terrestrial 2) -->
  <rect x="12" y="7.5" width="4.5" height="6.5" rx="0.8" fill="#f59e0b" />
  <rect x="12" y="15" width="4.5" height="5.5" rx="0.8" fill="#10b981" />
  
  <!-- Column 3 (e.g. Terrestrial 3) -->
  <rect x="17.5" y="7.5" width="4.5" height="8.5" rx="0.8" fill="#a855f7" />
  <rect x="17.5" y="17" width="4.5" height="3.5" rx="0.8" fill="#3b82f6" />
  
  <!-- Column 4 (e.g. Terrestrial 4) -->
  <rect x="23" y="7.5" width="2.5" height="5" rx="0.8" fill="#f43f5e" />
  <rect x="23" y="13.5" width="2.5" height="7" rx="0.8" fill="#eab308" />

  <!-- TV Stand Base -->
  <path d="M12.5 25.5H19.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M16 23.5V25.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
</svg>
